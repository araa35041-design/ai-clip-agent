<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Clip Agent</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
      padding: 30px 16px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {

      margin-bottom: 10px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca3af;
    }

    .card {
      background: #151c32;
      border: 1px solid #26304a;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #36415f;
      background: #0d1427;
      color: white;
      font-size: 15px;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .result {
      display: none;
    }

    .clip {
      background: #0d1427;
      border: 1px solid #293653;
      border-radius: 14px;
      padding: 18px;
      margin-top: 15px;
    }

    .clip-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .timestamp {
      color: #60a5fa;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .hook {
      background: #151c32;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .copy {
      background: #374151;
      font-size: 14px;
    }
