<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Clip Agent</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
      padding: 30px 16px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca3af;
    }

    .card {
      background: #151c32;
      border: 1px solid #26304a;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #36415f;
      background: #0d1427;
      color: white;
      font-size: 15px;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      display: none;
    }

    .clip {
      background: #0d1427;
      border: 1px solid #293653;
      border-radius: 14px;
      padding: 18px;
      margin-top: 15px;
    }

    .clip-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .timestamp {
      color: #60a5fa;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .hook {
      background: #151c32;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .copy {
      background: #374151;
      font-size: 14px;
      margin-top: 8px;
    }

    .note {
      color: #9ca3af;
      font-size: 13px;
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="logo">✂️</div>
      <h1>AI Clip Agent</h1>
      <p class="subtitle">
        Temukan momen menarik dan buat hook video
      </p>
    </div>

    <div class="card">

      <label>🔗 Link Video</label>

      <input
        type="url"
        id="videoLink"
        placeholder="Tempel link YouTube / TikTok"
      >

      <label>⏱️ Durasi Clip</label>

      <select id="duration">
        <option value="15">15 detik</option>
        <option value="30" selected>30 detik</option>
        <option value="45">45 detik</option>
        <option value="60">60 detik</option>
        <option value="90">90 detik</option>
      </select>

      <button onclick="analyzeVideo()">
        🤖 ANALYZE VIDEO
      </button>

      <p class="note">
        Versi ringan untuk membuat rekomendasi
        hook dan timestamp.
      </p>

    </div>

    <div class="card result" id="result">

      <h2>🔥 Rekomendasi Clip</h2>

      <div class="clip">

        <div class="clip-title">
          CLIP #1
        </div>

        <div class="timestamp" id="timestamp1">
          02:15 → 02:45
        </div>

        <div class="hook" id="hook1">
          Ternyata alasan sebenarnya bukan
          seperti yang kita kira...
        </div>

        <button
          class="copy"
          onclick="copyText('hook1')">
          📋 Copy Hook
        </button>

        <button
          class="copy"
          onclick="copyText('timestamp1')">
          ⏱️ Copy Timestamp
        </button>

      </div>

      <div class="clip">

        <div class="clip-title">
          CLIP #2
        </div>

        <div class="timestamp">
          08:20 → 08:50
        </div>

        <div class="hook">
          Bagian ini mungkin bakal bikin kamu
          berpikir ulang...
        </div>

        <button
          class="copy"
          onclick="copyStatic(
            'Bagian ini mungkin bakal bikin kamu berpikir ulang...'
          )">
          📋 Copy Hook
        </button>

      </div>

    </div>

  </div>

  <script>

    function analyzeVideo() {

      const link =
        document.getElementById("videoLink").value;

      const duration =
        Number(document.getElementById("duration").value);

      if (!link) {

        alert(
          "Silakan masukkan link video terlebih dahulu."
        );

        return;
      }

      const result =
        document.getElementById("result");

      result.style.display = "block";

      const startTime = 135;

      const endTime =
        startTime + duration;

      document.getElementById("timestamp1").textContent =
        formatTime(startTime) +
        " → " +
        formatTime(endTime);

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

    }

    function formatTime(seconds) {

      const minutes =
        Math.floor(seconds / 60);

      const secs =
        seconds % 60;

      return String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0");

    }

    function copyText(id) {

      const text =
        document.getElementById(id)
          .textContent
          .trim();

      navigator.clipboard.writeText(text);

      alert("Berhasil disalin!");

    }

    function copyStatic(text) {

      navigator.clipboard.writeText(text);

      alert("Hook berhasil disalin!");

    }

  </script>

</body>
</html>
