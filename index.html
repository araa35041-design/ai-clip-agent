<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Clip Agent</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
      padding: 25px 16px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 30px;
    }

    .card {
      background: #151c30;
      border: 1px solid #26304a;
      border-radius: 18px;
      padding: 20px;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #39445f;
      background: #0d1324;
      color: white;
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #result {
      margin-top: 20px;
    }

    .clip {
      background: #0d1324;
      border: 1px solid #29344f;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
    }

    .clip h3 {
      margin-bottom: 8px;
    }

    .time {
      color: #60a5fa;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .hook {
      color: #d1d5db;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🎬 AI Clip Agent</div>

    <p class="subtitle">
      Ubah video panjang menjadi clip menarik dengan bantuan AI.
    </p>

    <div class="card">

      <input
        id="videoUrl"
        type="url"
        placeholder="Tempel link YouTube di sini..."
      >

      <button onclick="analyzeVideo()">
        ANALISIS VIDEO
      </button>

      <div id="result"></div>

    </div>

  </div>

  <script>
    function analyzeVideo() {

      const url = document.getElementById("videoUrl").value;
      const result = document.getElementById("result");

      if (!url) {
        result.innerHTML =
          "<p style='color:#f87171;margin-top:15px;'>Masukkan link video terlebih dahulu.</p>";
        return;
      }

      result.innerHTML = `
        <p style="margin-top:20px;color:#60a5fa;">
          🤖 AI sedang menganalisis video...
        </p>
      `;

      setTimeout(() => {

        result.innerHTML = `
          <h2 style="margin-top:25px;">🔥 Kandidat Clip</h2>

          <div class="clip">
            <h3>Clip #1</h3>
            <div class="time">02:14 → 02:48</div>
            <p class="hook">
              "Ternyata banyak orang melakukan kesalahan ini..."
            </p>
          </div>

          <div class="clip">
            <h3>Clip #2</h3>
            <div class="time">05:31 → 06:12</div>
            <p class="hook">
              "Kebanyakan orang belum tahu fakta ini..."
            </p>
          </div>

          <div class="clip">
            <h3>Clip #3</h3>
            <div class="time">08:42 → 09:20</div>
            <p class="hook">
              "Bagian ini mungkin akan mengubah cara kamu melihatnya."
            </p>
          </div>
        `;

      }, 1500);
    }
  </script>

</body>
</html>
